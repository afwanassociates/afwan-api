# Build the API on every push to master and put a ready-to-run copy (with vendor/) in the
# "deploy" branch. Hostinger deploys that branch (hPanel → Advanced → Git), so it never has to
# run Composer itself, which fails there: "The Process class relies on proc_open, which is not
# available on your PHP installation".
name: Build and deploy

on:
  push:
    branches: [master]
  # Also lets you run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels a build still running.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same PHP line as composer.json ("php": "^8.4") and the extensions Laravel uses.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_mysql, zip, gd, fileinfo, curl, openssl
          tools: composer:v2
          coverage: none

      # Production packages only, with an optimised autoloader. Composer's post-autoload-dump
      # script writes the package manifest to bootstrap/cache (packages.php, services.php).
      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Check that the app boots without composer.json
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          rsync -a --exclude-from=.deployignore ./ "$RUNNER_TEMP/deploy/"
          cd "$RUNNER_TEMP/deploy"
          test -f vendor/autoload.php
          test -f bootstrap/cache/packages.php
          test ! -e composer.json
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan route:list --path=api/accounts > /dev/null
          rm .env

      # Force-add everything: vendor/ and bootstrap/cache are in .gitignore on master.
      - name: Publish the deploy branch
        working-directory: ${{ runner.temp }}/deploy
        # The commit message goes through an environment variable, never straight into the script.
        env:
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all --force
          git commit -q -m "Deploy ${GITHUB_SHA::7}: $(printf '%s' "${SOURCE_MESSAGE:-manual run}" | head -n 1)"
          git push --force --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
